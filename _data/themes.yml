      - { who: Shipped, what: User Groups, eff: GA on schedule }
      - { who: Defined, what: Managed Users, eff: concept to launch }

- id: enterprise-security
  name: Enterprise Security
  title: "Enterprise Security: Authentication, Authorization & Access"
  points:
    - "**Subject-matter expert for enterprise security**, accountable for who can access what across the platform and for closing security gaps. Sole owner of domain control and SSO."
    - "**Saved thousands of customer-support hours** by turning manual, email-based domain verification into a self-serve automated product. Led as DRI from design to launch."
  tags: [SSO, Authentication, Authorization, Domain control]
  figure:
    type: bars
    title: Same-day domain verification
    rows:
      - { label: By email, pct: 45, value: "~45%", tone: faint }
      - { label: Self-serve, pct: 70, value: "~70%", tone: green }

- id: product-direction
  name: Product Direction
  title: Product Direction
  points:
    - "**Go-to engineer for product managers:** I surface edge cases and scope decisions early through a decision log that a PM plans to reuse across projects."
