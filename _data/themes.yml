- id: cost-risk-reliability
  name: Cost, Risk & Reliability
  title: Cost, Risk & Reliability
  points:
    - "**Lowered infrastructure cost and strengthened GDPR compliance:** cut search-index storage ~30% and removed 500K+ orphaned records with continuous automated cleanup."
    - "**Restored a critical high-traffic feature during an incident** by cutting database calls per request from 185 to 23."
  tags: [OpenSearch, Temporal, GDPR]
  figure:
    type: bars
    title: DB calls per request, before and after
    rows:
      - { label: Before, pct: 100, value: "185", tone: faint }
      - { label: After, pct: 12.4, value: "23", tone: blue }
    caption: "Search-index storage also fell from 110 GB to 75 GB."
