# Each theme is one tab in "01 · Themes".
# `points` support **bold** markdown. `figure` draws the diagram on the right:
#   type: guards  -> stepped list (items: [text, ...]; the last one is highlighted)
#   type: flow    -> boxes and arrows (nodes: [{who, what, eff, highlight: true}])
#   type: bars    -> before/after bars (rows: [{label, pct, value, tone: faint|blue|green}])
#   type: sticky  -> one big number on a sticky note (value, text)
- id: agentic-ai
  name: Agentic AI
  title: Agentic AI for Enterprise Administration
  points:
    - "I **architected and built the agent tool layer** for Miro's agentic administration assistant, an AI chat assistant that answers enterprise admins' questions about their organization, teams, users and settings."
    - "I engineered it to be **enterprise-safe**: the agent acts with the real user's permissions, per-field authorization lets partially entitled admins still get answers, errors and data existence never leak to the model, and a canonical-URL tool stops the LLM inventing settings links."
  tags: [LLM tool calling, Agent security, Kotlin, gRPC]
  ai: true
  figure:
    type: guards
    title: Four guards on every answer
    items: [Acts as the real user, Per-field authorization, No leaks to the model, Canonical URLs only]

- id: ai-dev-productivity
  name: AI Developer Productivity
  title: AI Developer Productivity
  points:
    - "**Cut time to first PR review by 25%** by building AI code-review notification automation, giving multiple teams one unified platform and less review load."
    - "**Reduced on-call load** by automating alert and incident triage with deterministic problem evaluation, so engineers resolve issues faster."
  tags: [AI-assisted code review, Incident response, Observability]
  ai: true
  figure:
    type: bars
    title: Wait for a first PR review
    rows:
      - { label: Before, pct: 100, value: "100", tone: faint }
      - { label: After, pct: 75, value: "75", tone: blue }
    caption: Indexed to 100 before the change, a 25% cut.

- id: user-management
  name: User Management at Scale
  title: User Management at Scale
  points:
    - "**Delivered User Groups on schedule for GA** by taking on and refining an unexpected requirement. It's now available to all Enterprise and Business plan customers."
    - "**Owned the SCIM APIs**, hardening them for security, reliability and standard compliance, and built interactive SCIM docs customers can try live with an API key."
