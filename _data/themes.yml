# Each theme is one tab in "01. themes".
# `points` support **bold** markdown. `guards` (optional) render as the stepped
# list on the right; otherwise `panel_title` + `panel_items` are shown.
- id: agentic-ai
  name: Agentic AI
  color: violet
  kicker: Agentic AI for Enterprise Administration
  headline: An AI admin assistant that's safe enough for the enterprise.
  points:
    - "**Architected and built the agent tool layer** for Miro's agentic administration assistant, which answers admins' questions about their organization, teams, users and settings."
    - "**Engineered it to be enterprise-safe:** the agent acts with the real user's permissions, per-field authorization lets partially entitled admins still get answers, errors and data existence never leak to the model, and a canonical-URL tool stops the LLM inventing settings links."
  tags: [LLM tool calling, Agent security, Kotlin, gRPC]
  panel_title: every question passes four guards
  guards:
    - Acts as the real user
    - Per-field authorization
    - No leaks to the model
    - Canonical URLs only

