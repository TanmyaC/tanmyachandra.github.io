<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d17">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include nav.html %}
  <main id="main">
    {{ content }}
  </main>
  <footer class="footer">
    <div class="wrap footer__inner mono">
      <span>© {{ site.time | date: "%Y" }} {{ site.title }}</span>
      {%- if site.posts.size > 0 %}<a href="{{ '/feed.xml' | relative_url }}">{% include icon.html name="rss" size=13 %} RSS</a>{% endif %}
      <span>{{ site.location }}</span>
    </div>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
